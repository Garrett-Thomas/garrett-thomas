# This is a basic workflow to build and deploy a React app to GitHub Pages

name: Build and Deploy to GitHub Pages

# Controls when the workflow will run
on:
  # Triggers the workflow on push events to the main branch
  push:
    branches: [ "gh-pages" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Build job
  build:
    runs-on: ubuntu-latest # The type of runner that the job will run on
    steps: # Steps must be under the 'steps' key
      - name: Checkout repository
        uses: actions/checkout@v4 # Checks-out your repository

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Or the Node.js version you use

      - name: Install dependencies
        run: npm i
      - name: Build React app
        run: npm run build # Runs your build script

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3 # Uploads the build output
        with:
          path: dist/ 

  # Deployment job
  deploy:
    environment:
      name: github-pages # Refers to the github-pages environment
      # The URL will be set automatically by the deploy-pages action
    runs-on: ubuntu-latest # The type of runner that the job will run on
    needs: build # Ensures the build job completes first
    permissions: # Required permissions for deployment
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4 # Deploys the uploaded artifact
